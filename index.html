<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ambience</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{
    --bg:#0b0e1a; --bg2:#12162a; --card:#171c33; --line:#262c4a;
    --text:#e7e9f5; --muted:#8a90b3; --accent:#9fb4ff; --accent2:#c7a8ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  body{min-height:100vh;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 28px);
    background:radial-gradient(120% 60% at 50% 0%, #1a2045 0%, var(--bg) 60%)}
  .wrap{max-width:520px;margin:0 auto}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  h1{font-size:20px;font-weight:600;letter-spacing:.06em;margin:0}
  .iconbtn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;
    padding:6px 12px;font-size:13px}
  /* Orb */
  .stage{display:flex;flex-direction:column;align-items:center;padding:18px 0 8px}
  .orb{width:190px;height:190px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 40% 35%, #33407a, #161b38 70%);
    box-shadow:0 0 60px 6px rgba(130,150,255,.18), inset 0 0 40px rgba(0,0,0,.4);
    transition:box-shadow .6s ease}
  .orb .glow{position:absolute;inset:-8px;border-radius:50%;
    background:radial-gradient(circle, rgba(159,180,255,.22), transparent 65%);opacity:0;transition:opacity 1.2s ease}
  .playing .orb .glow{opacity:1}
  .playing .orb{animation:breathe var(--breath,7.5s) ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
  .chord{font-size:34px;font-weight:300;letter-spacing:.02em;position:relative;transition:opacity .5s}
  .progname{margin-top:14px;color:var(--muted);font-size:14px;letter-spacing:.04em}
  .play{margin-top:18px;width:74px;height:74px;border-radius:50%;border:none;
    background:linear-gradient(145deg,var(--accent),var(--accent2));color:#0b0e1a;
    display:flex;align-items:center;justify-content:center;box-shadow:0 8px 30px rgba(140,150,255,.3)}
  .play svg{width:30px;height:30px}
  .timerline{min-height:18px;margin-top:10px;font-size:13px;color:var(--muted)}
  /* Sections */
  section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:14px}
  section h2{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin:0 0 10px;font-weight:600}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .prog{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px 11px;text-align:left;color:var(--text)}
  .prog b{display:block;font-size:15px;font-weight:600}
  .prog span{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.35}
  .prog.on{border-color:var(--accent);background:#1c2450}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:var(--bg2);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:7px 12px;font-size:14px;min-width:42px}
  .chip.on{background:var(--accent);color:#0b0e1a;border-color:var(--accent);font-weight:600}
  .row{display:flex;align-items:center;gap:12px;margin:10px 0}
  .row label{width:74px;font-size:14px;color:var(--text)}
  .row output{width:44px;text-align:right;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;background:var(--line);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);border:none}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--accent);border:none}
  .sub{font-size:12px;color:var(--muted);margin:2px 0 8px}
  .toggle{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin-top:6px}
  .switch{width:46px;height:26px;border-radius:999px;background:var(--line);position:relative;border:none;transition:background .2s}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
  .switch.on{background:var(--accent)} .switch.on::after{left:23px}
  /* Dim overlay */
  #dim{position:fixed;inset:0;background:#000;display:none;z-index:10;align-items:center;justify-content:center;
    color:#2a2f4a;font-size:14px;letter-spacing:.1em}
  #dim.show{display:flex}
  footer{text-align:center;color:#4b5175;font-size:11px;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AMBIENCE</h1>
    <button class="iconbtn" id="dimBtn">Dim screen</button>
  </header>

  <div class="stage" id="stage">
    <div class="orb"><div class="glow"></div><div class="chord" id="chord">—</div></div>
    <div class="progname" id="progName"></div>
    <button class="play" id="playBtn" aria-label="Play">
      <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>
    </button>
    <div class="timerline" id="timerLine"></div>
  </div>

  <section>
    <h2>Progression</h2>
    <div class="grid" id="progGrid"></div>
  </section>

  <section>
    <h2>Key</h2>
    <div class="chips" id="keyChips"></div>
    <div class="row" style="margin-top:14px"><label>Tempo</label>
      <input type="range" id="tempo" min="44" max="84" step="1"><output id="tempoOut"></output></div>
  </section>

  <section>
    <h2>Layers</h2>
    <div class="row"><label>Pad</label><input type="range" id="v_pad" min="0" max="100"><output></output></div>
    <div class="row"><label>Bass</label><input type="range" id="v_bass" min="0" max="100"><output></output></div>
    <div class="row"><label>Keys</label><input type="range" id="v_keys" min="0" max="100"><output></output></div>
    <div class="row"><label>Sparkle</label><input type="range" id="v_spark" min="0" max="100"><output></output></div>
    <div class="row"><label>Pulse</label><input type="range" id="v_pulse" min="0" max="100"><output></output></div>
    <div class="sub" style="margin-top:12px">Keys pattern</div>
    <div class="chips" id="patChips"></div>
  </section>

  <section>
    <h2>Sound</h2>
    <div class="row"><label>Volume</label><input type="range" id="master" min="0" max="100"><output></output></div>
    <div class="row"><label>Space</label><input type="range" id="space" min="0" max="100"><output></output></div>
    <div class="row"><label>Warmth</label><input type="range" id="warmth" min="0" max="100"><output></output></div>
  </section>

  <section>
    <h2>Sleep timer</h2>
    <div class="chips" id="sleepChips"></div>
    <div class="sub" style="margin-top:8px">Fades out gently over the last minute.</div>
    <div class="toggle"><span>Keep screen awake while playing</span><button class="switch" id="wakeSw" aria-label="Keep awake"></button></div>
  </section>

  <section>
    <h2>No sound?</h2>
    <div class="sub">Turn the media volume up while it plays. If it's still silent, try these:</div>
    <div class="chips" style="margin:8px 0 4px">
      <button class="chip" id="beepBtn">Test beep</button>
      <button class="chip" id="mediaBeepBtn">Test media beep</button>
    </div>
    <div class="sub" id="diag" style="margin-top:10px;word-break:break-word"></div>
  </section>

  <footer>Pure tones · no tremolo · loops forever</footer>
</div>
<div id="dim">tap to wake</div>
<audio id="player" playsinline preload="auto"></audio>

<script>
(() => {
'use strict';

/* ---------- Music data ---------- */
const CHORD = {
  maj:[0,4,7], min:[0,3,7], maj7:[0,4,7,11], m7:[0,3,7,10], dom7:[0,4,7,10],
  add9:[0,4,7,14], madd9:[0,3,7,14], maj9:[0,4,7,11,14], m9:[0,3,7,10,14],
  dom9:[0,4,7,10,14], six:[0,4,7,9], m6:[0,3,7,9], sus2:[0,2,7], sus4:[0,5,7], six9:[0,4,7,9,14]
};
const SUFFIX = {maj:'',min:'m',maj7:'maj7',m7:'m7',dom7:'7',add9:'add9',madd9:'m(add9)',maj9:'maj9',m9:'m9',
  dom9:'9',six:'6',m6:'m6',sus2:'sus2',sus4:'sus4',six9:'6/9'};
const NOTE_NAMES = ['C','D♭','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];

// [semitones from tonic, chord type, bars]
const PROGS = [
  {id:'echo', name:'Echo ♡', roman:'Imaj9 · III7 · vi9 · IV · iv · I', echo:true,
   chords:[[0,'maj9',2],[4,'dom7',2],[9,'m9',2],[5,'maj7',1],[5,'m6',1],[0,'six9',2]]},
  {id:'lullaby', name:'Lullaby', roman:'I · vi · IV · V', chords:[[0,'add9',2],[9,'m7',2],[5,'maj7',2],[7,'sus2',1],[7,'add9',1]]},
  {id:'drift', name:'Drift', roman:'Imaj9 · IVmaj9', chords:[[0,'maj9',2],[5,'maj9',2]]},
  {id:'moonlit', name:'Moonlit', roman:'i · VI · III · VII', chords:[[0,'m9',2],[8,'maj7',2],[3,'maj7',2],[10,'add9',2]]},
  {id:'canon', name:'Canon', roman:'I · V · vi · iii · IV · I · IV · V', chords:[[0,'add9',1],[7,'maj',1],[9,'m7',1],[4,'m7',1],[5,'maj7',1],[0,'maj',1],[5,'add9',1],[7,'sus4',1]]},
  {id:'lofi', name:'Lo-fi Night', roman:'ii9 · V9 · Imaj9 · vi9', chords:[[2,'m9',2],[7,'dom9',2],[0,'maj9',2],[9,'m9',2]]},
  {id:'floating', name:'Floating', roman:'Imaj7 · iii7 · IVmaj7 · iv6', chords:[[0,'maj7',2],[4,'m7',2],[5,'maj7',2],[5,'m6',2]]},
  {id:'ocean', name:'Ocean', roman:'I · V · vi · IV', chords:[[0,'add9',2],[7,'sus2',2],[9,'madd9',2],[5,'add9',2]]},
  {id:'sunrise', name:'Sunrise', roman:'IV · V · iii · vi', chords:[[5,'maj7',2],[7,'six',2],[4,'m7',2],[9,'m9',2]]},
  {id:'deep', name:'Deep Sleep', roman:'i · iv  (slow)', chords:[[0,'m9',4],[5,'m7',4]]},
  {id:'still', name:'Still Water', roman:'I · ii · I · IV', chords:[[0,'six9',2],[2,'m9',2],[0,'maj9',2],[5,'six9',2]]},
];
const PATTERNS = [
  {id:'flow', name:'Flowing'}, {id:'rise', name:'Rising'}, {id:'wander', name:'Wandering'}, {id:'sparse', name:'Sparse'}
];
const SLEEP = [0,15,30,45,60,90];

/* ---------- Settings ---------- */
const DEFAULTS = {prog:'lullaby', key:0, tempo:62, pad:70, bass:65, keys:45, spark:25, pulse:20,
  pattern:'flow', master:75, space:60, warmth:55, wake:false};
let S = {...DEFAULTS};
try { Object.assign(S, JSON.parse(localStorage.getItem('ambiance') || '{}')); } catch(e) {}
const save = () => { try { localStorage.setItem('ambiance', JSON.stringify(S)); } catch(e) {} };

/* ---------- Audio engine ---------- */
let ctx = null, out = {}, waves = {}, playing = false;
let step = 0, nextTime = 0, worker = null, activePads = [], lastPadCenter = 60;
let sleepEnd = 0, sleepFading = false, wakeLock = null;

const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const prog = () => PROGS.find(p => p.id === S.prog) || PROGS[0];

function buildWave(harm) {
  const re = new Float32Array(harm.length + 1), im = new Float32Array(harm.length + 1);
  harm.forEach((a, i) => { im[i + 1] = a; });
  return ctx.createPeriodicWave(re, im);
}

// Cheap reverb with no convolver and no feedback: a few early reflections, each fed through longer taps.
function buildReverb() {
  const input = ctx.createGain(), output = ctx.createGain();
  const damp = ctx.createBiquadFilter(); damp.type = 'lowpass'; damp.frequency.value = 2400; damp.Q.value = 0;
  input.connect(damp);
  const early = ctx.createGain(), merge = ctx.createChannelMerger(2);
  [[.013,.9],[.023,.72],[.031,.6],[.043,.48]].forEach(([dt, g]) => {
    const d = ctx.createDelay(.2), gg = ctx.createGain(); d.delayTime.value = dt; gg.gain.value = g;
    damp.connect(d); d.connect(gg); gg.connect(early);
  });
  [[.057,.5,0],[.071,.46,1],[.097,.4,0],[.119,.36,1],[.157,.3,0],[.181,.27,1],[.233,.21,0],[.271,.18,1],[.337,.13,0],[.389,.11,1]].forEach(([dt, g, ch]) => {
    const d = ctx.createDelay(.5), gg = ctx.createGain(); d.delayTime.value = dt; gg.gain.value = g;
    early.connect(d); d.connect(gg); gg.connect(merge, 0, ch);
  });
  merge.connect(output);
  output.gain.value = 0.6;
  return {input, output};
}

function initAudio() {
  ctx = new (window.AudioContext || window.webkitAudioContext)({latencyHint: 'playback'});
  waves.warm = buildWave([1, 0.28, 0.07, 0.02]);            // pad: mostly fundamental
  waves.keys = buildWave([1, 0.42, 0.14, 0.06, 0.025, 0.01]); // soft electric-piano-ish
  waves.bass = buildWave([1, 0.5, 0.12, 0.03]);                  // sub + a touch of 2nd so phones hear it

  out.master = ctx.createGain(); out.master.gain.value = 0;
  out.hp = ctx.createBiquadFilter(); out.hp.type = 'highpass'; out.hp.frequency.value = 42; out.hp.Q.value = 0.7;
  out.limiter = ctx.createDynamicsCompressor();
  out.limiter.threshold.value = -6; out.limiter.knee.value = 0; out.limiter.ratio.value = 20; out.limiter.attack.value = 0.002; out.limiter.release.value = 0.25;
  out.trim = ctx.createGain(); out.trim.gain.value = 1.2;
  out.warmth = ctx.createBiquadFilter(); out.warmth.type = 'lowpass'; out.warmth.Q.value = 0.5;
  out.dry = ctx.createGain();
  out.verb = buildReverb();
  out.verbReturn = ctx.createGain();
  out.send = ctx.createGain();

  out.dry.connect(out.warmth);
  out.send.connect(out.verb.input); out.verb.output.connect(out.verbReturn); out.verbReturn.connect(out.warmth);
  out.warmth.connect(out.hp); out.hp.connect(out.trim); out.trim.connect(out.limiter); out.limiter.connect(out.master);

  routeOutput();

  // Per-layer buses
  for (const k of ['pad', 'bass', 'keys', 'spark', 'pulse']) {
    const g = ctx.createGain();
    g.connect(out.dry);
    const s = ctx.createGain();
    g.connect(s); s.connect(out.send);
    out[k] = g; out[k + 'Send'] = s;
  }
  // Bass and pulse stay mostly dry so the low end is clean
  out.bassSend.gain.value = 0.12; out.pulseSend.gain.value = 0.05;
  out.padSend.gain.value = 0.9; out.keysSend.gain.value = 1; out.sparkSend.gain.value = 1.2;
  // gentle per-layer tone shaping
  out.keysLP = ctx.createBiquadFilter(); out.keysLP.type = 'lowpass'; out.keysLP.frequency.value = 2600;
  out.keysLP.connect(out.keys);
  out.echo = ctx.createDelay(3);
  out.echoFb = ctx.createGain(); out.echoFb.gain.value = 0.4;
  out.echoTone = ctx.createBiquadFilter(); out.echoTone.type = 'lowpass'; out.echoTone.frequency.value = 2000;
  out.echoWet = ctx.createGain(); out.echoWet.gain.value = 0;
  out.echoIn = ctx.createGain();
  out.echoIn.connect(out.echo); out.echo.connect(out.echoTone); out.echoTone.connect(out.echoFb); out.echoFb.connect(out.echo);
  out.echoTone.connect(out.echoWet); out.echoWet.connect(out.keys);
  out.keysLP.connect(out.echoIn); out.spark.connect(out.echoIn);
  out.padLP = ctx.createBiquadFilter(); out.padLP.type = 'lowpass'; out.padLP.frequency.value = 1400; out.padLP.Q.value = 0.3;
  out.padLP.connect(out.pad);
  applyMix(true);

  worker = new Worker(URL.createObjectURL(new Blob(
    ['let t=null;onmessage=e=>{if(e.data==="start"){clearInterval(t);t=setInterval(()=>postMessage(0),100)}else{clearInterval(t)}}'],
    {type: 'text/javascript'})));
  worker.onmessage = tick;
}

function routeOutput() { out.master.connect(ctx.destination); }

let diagMsg = '';
function diag(m) { if (m) diagMsg = m; const el = document.getElementById('diag'); if (!el) return;
  el.textContent = (ctx ? 'Audio engine: ' + ctx.state + ' · ' + ctx.sampleRate + ' Hz' : 'Audio engine: not started') +
    (diagMsg ? ' · ' + diagMsg : ''); }
window.addEventListener('error', e => diag('error: ' + e.message));
window.addEventListener('unhandledrejection', e => diag('error: ' + (e.reason && e.reason.message || e.reason)));
setInterval(() => diag(), 1000);

function applyMix(instant) {
  if (!ctx) return;
  const now = ctx.currentTime, tc = instant ? 0.001 : 0.15;
  const curve = v => Math.pow(v / 100, 1.6);
  out.pad.gain.setTargetAtTime(curve(S.pad) * 1.0, now, tc);
  out.bass.gain.setTargetAtTime(curve(S.bass) * 1.0, now, tc);
  out.keys.gain.setTargetAtTime(curve(S.keys) * 1.0, now, tc);
  out.spark.gain.setTargetAtTime(curve(S.spark) * 1.0, now, tc);
  out.pulse.gain.setTargetAtTime(curve(S.pulse) * 1.0, now, tc);
  const sp = S.space / 100;
  out.verbReturn.gain.setTargetAtTime(sp * 1.6, now, tc);
  out.dry.gain.setTargetAtTime(1 - sp * 0.35, now, tc);
  out.warmth.frequency.setTargetAtTime(9000 * Math.pow(0.12, S.warmth / 100) + 500, now, tc);
  out.echo.delayTime.setTargetAtTime(stepDur() * 3, now, instant ? 0.001 : 0.3);   // dotted-eighth echo
  out.echoWet.gain.setTargetAtTime(prog().echo ? 0.55 : 0, now, instant ? 0.001 : 0.6);
  if (playing && !sleepFading) out.master.gain.setTargetAtTime(masterLevel(), now, tc);
}
const masterLevel = () => Math.pow(S.master / 100, 1.5) * 0.85;

/* ---------- Voices ---------- */
function voice(wave, freq, t, dest, pan = 0) {
  const o = ctx.createOscillator();
  if (wave === 'sine') o.type = 'sine'; else o.setPeriodicWave(wave);
  o.frequency.value = freq;
  const g = ctx.createGain(); g.gain.value = 0;
  let node = g;
  if (false && pan) { const p = ctx.createStereoPanner(); p.pan.value = pan; g.connect(p); node = p; }
  o.connect(g); node.connect(dest);
  o.start(t);
  o.onended = () => { try { o.disconnect(); g.disconnect(); if (node !== g) node.disconnect(); } catch (e) {} };
  return {o, g};
}

function voicing(chord) {
  const [root, type] = chord;
  const ints = CHORD[type];
  let base = 48 + ((S.key + root) % 12);           // C3..B3
  const notes = ints.map(i => base + i);
  // choose the inversion whose centre is closest to the previous chord's centre (smooth voice leading)
  let best = notes, bestD = 1e9;
  for (let inv = 0; inv < notes.length; inv++) {
    for (const shift of [-12, 0]) {
      const v = notes.map((n, i) => (i < inv ? n + 12 : n) + shift).sort((a, b) => a - b);
      const c = v.reduce((a, b) => a + b, 0) / v.length;
      if (v[0] < 45 || v[v.length - 1] > 79) continue;
      const d = Math.abs(c - lastPadCenter) + Math.abs(c - 60) * 0.35;
      if (d < bestD) { bestD = d; best = v; }
    }
  }
  lastPadCenter = best.reduce((a, b) => a + b, 0) / best.length;
  return best;
}

function playPad(notes, t, dur) {
  const per = 0.085 / Math.sqrt(notes.length);
  const atk = Math.min(2.8, dur * 0.4), rel = 2.6;
  notes.forEach((n, i) => {
    const pan = notes.length > 1 ? (i / (notes.length - 1) - 0.5) * 0.7 : 0;
    const v = voice(waves.warm, mtof(n), t, out.padLP, pan);
    v.g.gain.setValueAtTime(0, t);
    v.g.gain.linearRampToValueAtTime(per, t + atk);
    v.g.gain.setTargetAtTime(0, t + dur, rel / 3);
    v.o.stop(t + dur + rel * 1.8);
    activePads.push({v, end: t + dur});
  });
}

function releasePads(t) {
  for (const p of activePads) {
    if (p.end > t) {
      try {
        const g = p.v.g.gain;
        if (g.cancelAndHoldAtTime) g.cancelAndHoldAtTime(t); else { g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); }
        g.setTargetAtTime(0, t, 0.8); p.v.o.stop(t + 6);
      } catch (e) {}
    }
  }
  activePads = activePads.filter(p => p.end > t + 6);
}

function playBass(midi, t, dur, vel) {
  const f = mtof(midi);
  const v = voice(waves.bass, f, t, out.bass);
  const peak = 0.24 * vel;
  v.g.gain.setValueAtTime(0, t);
  v.g.gain.linearRampToValueAtTime(peak, t + 0.035);
  v.g.gain.setTargetAtTime(peak * 0.55, t + 0.035, 0.5);
  v.g.gain.setTargetAtTime(0, t + dur, 0.25);
  v.o.stop(t + dur + 1.0);
}

function playKey(midi, t, vel, pan) {
  const v = voice(waves.keys, mtof(midi), t, out.keysLP, pan);
  const peak = 0.06 * vel;
  v.g.gain.setValueAtTime(0, t);
  v.g.gain.linearRampToValueAtTime(peak, t + 0.012);
  v.g.gain.setTargetAtTime(0, t + 0.012, 0.45);
  v.o.stop(t + 2.4);
}

function playSpark(midi, t) {
  const pan = (Math.random() - 0.5) * 1.2;
  [[1, 1]].forEach(([mul, amt]) => {     // pure octave partial only: no beating
    const v = voice('sine', mtof(midi) * mul, t, out.spark, pan);
    const peak = 0.035 * amt;
    v.g.gain.setValueAtTime(0, t);
    v.g.gain.linearRampToValueAtTime(peak, t + 0.02);
    v.g.gain.setTargetAtTime(0, t + 0.02, mul === 1 ? 1.1 : 0.5);
    v.o.stop(t + 4.5);
  });
}

function playPulse(t, vel) {
  const o = ctx.createOscillator(); o.type = 'sine';
  const g = ctx.createGain(); g.gain.value = 0;
  o.frequency.setValueAtTime(82, t);
  o.frequency.exponentialRampToValueAtTime(55, t + 0.18);
  o.connect(g); g.connect(out.pulse);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.16 * vel, t + 0.02);
  g.gain.setTargetAtTime(0, t + 0.02, 0.11);
  o.start(t); o.stop(t + 1);
  o.onended = () => { try { o.disconnect(); g.disconnect(); } catch (e) {} };
}

/* ---------- Sequencer (eighth-note grid) ---------- */
let arpIdx = 0, arpDir = 1, curChord = -1, chordNotes = [], arpNotes = [];
const stepDur = () => 60 / S.tempo / 2;
const totalSteps = () => prog().chords.reduce((a, c) => a + c[2] * 8, 0);

function locate(s) {
  let pos = s % totalSteps(), i = 0;
  const ch = prog().chords;
  while (pos >= ch[i][2] * 8) { pos -= ch[i][2] * 8; i++; }
  return {i, pos, chord: ch[i]};
}

function chordName(c) { return NOTE_NAMES[(S.key + c[0]) % 12] + SUFFIX[c[1]]; }

function scheduleStep(s, t) {
  const {i, pos, chord} = locate(s);
  const chordSteps = chord[2] * 8, bar = pos % 8;

  if (pos === 0) {
    chordNotes = voicing(chord);
    const upper = chordNotes.map(n => n + 12);
    arpNotes = [...upper, upper[0] + 12, (upper[1] || upper[0]) + 12].filter(n => n <= 86).sort((a, b) => a - b);
    if (S.pad > 0) playPad(chordNotes, t, chordSteps * stepDur());
    const label = chordName(chord);
    const delay = Math.max(0, (t - ctx.currentTime) * 1000);
    setTimeout(() => setChordLabel(label), delay);
    curChord = i;
  }

  const bassRoot = 36 + ((S.key + chord[0]) % 12);  // C2..B2
  if (S.bass > 0) {
    if (bar === 0) playBass(bassRoot, t, stepDur() * 4.6, 1);
    else if (bar === 5) playBass(bassRoot + (Math.random() < 0.3 ? 12 : 0), t, stepDur() * 2.4, 0.6);
    else if (bar === 7 && pos === chordSteps - 1 && Math.random() < 0.4) playBass(bassRoot + 7, t, stepDur() * 0.9, 0.4);
  }

  if (S.pulse > 0 && (bar === 0 || bar === 4)) playPulse(t, bar === 0 ? 1 : 0.6);

  if (S.keys > 0 && arpNotes.length) {
    const pat = S.pattern;
    let play = true, n;
    if (pat === 'sparse') play = (bar % 2 === 0) && Math.random() < 0.75;
    else if (pat === 'wander') play = Math.random() < 0.7;
    else play = bar !== 7 || Math.random() < 0.5;   // a little breath at the end of each bar
    if (play) {
      if (pat === 'rise') { n = arpNotes[arpIdx % arpNotes.length]; arpIdx++; }
      else if (pat === 'wander') {
        arpIdx = Math.max(0, Math.min(arpNotes.length - 1, arpIdx + (Math.random() < 0.5 ? -1 : 1) * (Math.random() < 0.8 ? 1 : 2)));
        n = arpNotes[arpIdx];
      } else {
        if (arpIdx >= arpNotes.length - 1) arpDir = -1; else if (arpIdx <= 0) arpDir = 1;
        n = arpNotes[Math.max(0, Math.min(arpIdx, arpNotes.length - 1))]; arpIdx += arpDir;
      }
      const vel = (bar === 0 ? 1 : bar % 2 === 0 ? 0.78 : 0.6) * (0.9 + Math.random() * 0.15);
      const swing = bar % 2 === 1 ? stepDur() * 0.06 : 0;
      playKey(n, t + swing, vel, ((arpIdx % 3) - 1) * 0.25);
    }
  }

  if (S.spark > 0 && bar === 0 && Math.random() < 0.45) {
    const n = chordNotes[Math.floor(Math.random() * chordNotes.length)] + 24;
    playSpark(Math.min(n, 96), t + stepDur() * Math.floor(Math.random() * 6));
  }
}

function tick() {
  if (!playing) return;
  const ahead = 1.2;
  while (nextTime < ctx.currentTime + ahead) {
    scheduleStep(step, nextTime);
    nextTime += stepDur();
    step++;
  }
  // sleep timer
  if (sleepEnd) {
    const left = sleepEnd - Date.now();
    if (left <= 60000 && !sleepFading) {
      sleepFading = true;
      out.master.gain.cancelScheduledValues(ctx.currentTime);
      out.master.gain.setValueAtTime(out.master.gain.value, ctx.currentTime);
      out.master.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + Math.max(1, left / 1000));
    }
    if (left <= 0) { stop(true); S.sleep = 0; renderSleep(); }
    updateTimerLine();
  }
}

// A silent looping <audio> element, started inside the tap, switches iOS into "playback" audio mode
// (so the silent switch doesn't mute us) and helps keep audio alive. It carries no actual sound.
let unlocked = false;
function unlockAudio() {
  if (unlocked) return; unlocked = true;
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  try {
    const n = 8000 * 3, b = new ArrayBuffer(44 + n * 2), v = new DataView(b),
      w = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, 8000, true); v.setUint32(28, 16000, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
    const el = document.getElementById('player');
    el.src = URL.createObjectURL(new Blob([b], {type: 'audio/wav'})); el.loop = true;
    const p = el.play(); if (p && p.catch) p.catch(() => {});
  } catch (e) {}
}

async function start() {
  unlockAudio();
  if (!ctx) {
    initAudio();
    ctx.onstatechange = () => { if (playing && ctx.state !== 'running') ctx.resume().catch(() => {}); };
  }
  try { await ctx.resume(); } catch (e) { diag('resume failed: ' + e.message); }
  setTimeout(() => { if (playing && ctx.state !== 'running') diag('audio is ' + ctx.state + ' – tap play again'); }, 700);
  playing = true;
  step = 0; arpIdx = 0; lastPadCenter = 60;
  nextTime = ctx.currentTime + 0.15;
  sleepFading = false;
  out.master.gain.cancelScheduledValues(ctx.currentTime);
  out.master.gain.setValueAtTime(0, ctx.currentTime);
  out.master.gain.linearRampToValueAtTime(masterLevel(), ctx.currentTime + 2.5);
  worker.postMessage('start');
  tick();
  if (sleepMinutes) sleepEnd = Date.now() + sleepMinutes * 60000;
  setUI();
  requestWake();
  mediaSession();
}

function stop(fromSleep) {
  if (!ctx || !playing) return;
  playing = false;
  worker.postMessage('stop');
  const now = ctx.currentTime;
  out.master.gain.cancelScheduledValues(now);
  out.master.gain.setValueAtTime(out.master.gain.value, now);
  out.master.gain.linearRampToValueAtTime(0, now + (fromSleep ? 0.3 : 1.8));
  releasePads(now);
  setTimeout(() => { if (!playing) { ctx.suspend(); } }, 2200);
  sleepEnd = 0; sleepFading = false;
  if (fromSleep) sleepMinutes = 0;
  releaseWake();
  setUI();
  setChordLabel('—');
}

function restartProgression() {
  if (!playing) return;
  const t = ctx.currentTime + 0.1;
  releasePads(t);
  step = 0; arpIdx = 0;
  nextTime = t + 0.4;
}

/* ---------- Wake lock & media session ---------- */
async function requestWake() {
  if (!S.wake || !('wakeLock' in navigator) || !playing) return;
  try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
}
function releaseWake() { if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; } }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { requestWake(); if (playing && ctx) ctx.resume().catch(() => {}); } });

function mediaSession() {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: prog().name, artist: 'Ambience', album: NOTE_NAMES[S.key] + ' · ' + S.tempo + ' bpm',
    artwork: [{src: 'icons/icon-512.png', sizes: '512x512', type: 'image/png'}]
  });
  navigator.mediaSession.setActionHandler('play', () => start());
  navigator.mediaSession.setActionHandler('pause', () => stop());
  navigator.mediaSession.setActionHandler('stop', () => stop());
  navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
}

/* ---------- UI ---------- */
const $ = id => document.getElementById(id);
let sleepMinutes = 0;

function setChordLabel(txt) {
  const el = $('chord');
  el.style.opacity = 0;
  setTimeout(() => { el.textContent = txt; el.style.opacity = 1; }, 350);
}

function setUI() {
  $('stage').classList.toggle('playing', playing);
  $('playIcon').innerHTML = playing ? '<path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/>' : '<path d="M8 5.5v13l11-6.5z"/>';
  $('playBtn').setAttribute('aria-label', playing ? 'Pause' : 'Play');
  $('progName').textContent = prog().name + ' · ' + NOTE_NAMES[S.key] + ' · ' + S.tempo + ' bpm';
  document.documentElement.style.setProperty('--breath', (60 / S.tempo * 8).toFixed(2) + 's');
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
  updateTimerLine();
}

function updateTimerLine() {
  if (!sleepMinutes) { $('timerLine').textContent = ''; return; }
  if (!playing || !sleepEnd) { $('timerLine').textContent = 'Sleep timer: ' + sleepMinutes + ' min'; return; }
  const left = Math.max(0, sleepEnd - Date.now());
  const m = Math.floor(left / 60000), s = Math.floor(left / 1000) % 60;
  $('timerLine').textContent = 'Stops in ' + m + ':' + String(s).padStart(2, '0');
}

function renderProgs() {
  $('progGrid').innerHTML = '';
  PROGS.forEach(p => {
    const b = document.createElement('button');
    b.className = 'prog' + (p.id === S.prog ? ' on' : '');
    b.innerHTML = '<b>' + p.name + '</b><span>' + p.roman + '</span>';
    b.onclick = () => { S.prog = p.id; save(); renderProgs(); setUI(); restartProgression(); applyMix(); mediaSession(); };
    $('progGrid').appendChild(b);
  });
}
function renderKeys() {
  $('keyChips').innerHTML = '';
  NOTE_NAMES.forEach((n, i) => {
    const b = document.createElement('button');
    b.className = 'chip' + (i === S.key ? ' on' : '');
    b.textContent = n;
    b.onclick = () => { S.key = i; save(); renderKeys(); setUI(); restartProgression(); mediaSession(); };
    $('keyChips').appendChild(b);
  });
}
function renderPatterns() {
  $('patChips').innerHTML = '';
  PATTERNS.forEach(p => {
    const b = document.createElement('button');
    b.className = 'chip' + (p.id === S.pattern ? ' on' : '');
    b.textContent = p.name;
    b.onclick = () => { S.pattern = p.id; save(); renderPatterns(); };
    $('patChips').appendChild(b);
  });
}
function renderSleep() {
  $('sleepChips').innerHTML = '';
  SLEEP.forEach(m => {
    const b = document.createElement('button');
    b.className = 'chip' + (m === sleepMinutes ? ' on' : '');
    b.textContent = m ? m + 'm' : 'Off';
    b.onclick = () => {
      sleepMinutes = m;
      sleepEnd = (m && playing) ? Date.now() + m * 60000 : 0;
      if (sleepFading && playing) { sleepFading = false; applyMix(); out.master.gain.setTargetAtTime(masterLevel(), ctx.currentTime, 0.5); }
      renderSleep(); updateTimerLine();
    };
    $('sleepChips').appendChild(b);
  });
}

function bindSlider(id, key, fmt = v => v) {
  const el = $(id), o = el.parentElement.querySelector('output');
  el.value = S[key]; o.textContent = fmt(S[key]);
  el.addEventListener('input', () => {
    S[key] = +el.value; o.textContent = fmt(S[key]); save();
    if (key === 'tempo') setUI();
    applyMix();
  });
}

bindSlider('tempo', 'tempo');
bindSlider('v_pad', 'pad'); bindSlider('v_bass', 'bass'); bindSlider('v_keys', 'keys');
bindSlider('v_spark', 'spark'); bindSlider('v_pulse', 'pulse');
bindSlider('master', 'master'); bindSlider('space', 'space'); bindSlider('warmth', 'warmth');
renderProgs(); renderKeys(); renderPatterns(); renderSleep(); setUI();

$('playBtn').onclick = () => { if (playing) stop(); else start().catch(e => diag('start failed: ' + e.message)); };

// Plain 440 Hz beep through the Web Audio engine (bypasses all effects)
$('beepBtn').onclick = async () => {
  unlockAudio();
  try {
    if (!ctx) { initAudio(); }
    await ctx.resume();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = 440; g.gain.value = 0;
    const t = ctx.currentTime;
    g.gain.linearRampToValueAtTime(0.3, t + 0.02); g.gain.setTargetAtTime(0, t + 0.6, 0.08);
    o.connect(g);
    g.connect(ctx.destination);
    o.start(t); o.stop(t + 1.2);
    diag('beep sent');
  } catch (e) { diag('beep failed: ' + e.message); }
};
// Beep through a normal media player (no Web Audio at all)
$('mediaBeepBtn').onclick = () => {
  const sr = 22050, n = sr, b = new ArrayBuffer(44 + n * 2), v = new DataView(b);
  const w = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
  w(0,'RIFF'); v.setUint32(4,36+n*2,true); w(8,'WAVE'); w(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true);
  v.setUint16(22,1,true); v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  w(36,'data'); v.setUint32(40,n*2,true);
  for (let i = 0; i < n; i++) { const env = Math.min(1, i / 400, (n - i) / 4000); v.setInt16(44 + i * 2, Math.sin(2 * Math.PI * 523.25 * i / sr) * 9000 * env, true); }
  const a = new Audio(URL.createObjectURL(new Blob([b], {type: 'audio/wav'})));
  a.play().then(() => diag('media beep playing')).catch(e => diag('media beep failed: ' + e.message));
};
diag();
$('wakeSw').classList.toggle('on', S.wake);
$('wakeSw').onclick = () => {
  S.wake = !S.wake; save(); $('wakeSw').classList.toggle('on', S.wake);
  S.wake ? requestWake() : releaseWake();
};
$('dimBtn').onclick = () => $('dim').classList.add('show');
$('dim').onclick = () => $('dim').classList.remove('show');

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
